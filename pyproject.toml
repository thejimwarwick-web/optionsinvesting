[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "value-options-paper-fund"
version = "0.1.0"
description = "Deterministic, offline controls for the Value & Options Paper Fund"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
live = ["google-auth>=2.40,<3", "requests>=2.32,<3"]

[project.scripts]
value-options = "value_options.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
